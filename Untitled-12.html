<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Primera Web con SVG</title>
    <style>
        body {
            background: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px;
            margin: 0;
        }
        h1 {
            color: #222;
            margin-bottom: 30px;
        }
        svg {
            border: 2px solid #ccc;
            background: #fff;
        }
        .f {
            fill: none;
            stroke: #000000;
            stroke-width: 3;
        }
    </style>
</head>
<body>

   
    <h1>Hola, profe, esta es mi primera web,</h1>

    <svg width="250" height="350" viewBox="0 0 250 350">
        <rect class="f" x="60" y="20" width="130" height="110"/>       <!-- Cabeza -->
        <polygon class="f" points="60,20 95,20 77,-20"/>             <!-- Oreja izq -->
        <polygon class="f" points="190,20 155,20 172,-20"/>          <!-- Oreja der -->
        <circle class="f" cx="95" cy="65" r="10"/>                   <!-- Ojo izq -->
        <circle class="f" cx="155" cy="65" r="10"/>                  <!-- Ojo der -->
        <rect class="f" x="110" y="95" width="30" height="25"/>       <!-- Nariz -->
        <rect class="f" x="70" y="135" width="110" height="120"/>     <!-- Cuerpo -->
        <rect class="f" x="75" y="255" width="35" height="70"/>        <!-- Pata izq -->
        <rect class="f" x="140" y="255" width="35" height="70"/>       <!-- Pata der -->
    </svg>

</body>
</html>
