<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Actividad SVG</title>
    <style>
        body {
            background: #fff;
            font-family: Arial;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <h1>Hola, profe, esta es mi primera web</h1>

    <svg width="250" height="350" viewBox="0 0 250 350" style="border:1px solid #000;">
        <!-- Estilo de las líneas -->
        <style>
            .linea { fill: none; stroke: black; stroke-width: 3; }
        </style>

        <!-- Figura sencilla -->
        <rect class="linea" x="60" y="20" width="130" height="110"/>
        <polygon class="linea" points="60,20 95,20 75,-25"/>
        <polygon class="linea" points="190,20 155,20 175,-25"/>
        <circle class="linea" cx="95" cy="65" r="10"/>
        <circle class="linea" cx="155" cy="65" r="10"/>
        <rect class="linea" x="110" y="95" width="30" height="25"/>
        <rect class="linea" x="70" y="135" width="110" height="120"/>
        <rect class="linea" x="75" y="255" width="35" height="70"/>
        <rect class="linea" x="140" y="255" width="35" height="70"/>
    </svg>

</body>
</html>
