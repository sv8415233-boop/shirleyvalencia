<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Página SVG</title>
    <style>
        body {
            background: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
        }
        svg {
            margin-top: 30px;
            border: 2px solid #222;
            background: #fff;
        }
        .figura {
            fill: none;
            stroke: #000000;
            stroke-width: 3;
            stroke-linecap: square;
        }
    </style>
</head>
<body>

    <h1>Hola, profe, esta es mi primera web</h1>

    <svg width="250" height="320" viewBox="0 0 250 320" xmlns="http://www.w3.org/2000/svg">
        <!-- Cabeza -->
        <rect class="figura" x="60" y="20" width="130" height="100"/>
        <!-- Orejas -->
        <polygon class="figura" points="60,20 95,20 75,-20"/>
        <polygon class="figura" points="190,20 155,20 175,-20"/>
        <!-- Ojos -->
        <circle class="figura" cx="95" cy="60" r="10"/>
        <circle class="figura" cx="155" cy="60" r="10"/>
        <!-- Nariz -->
        <rect class="figura" x="110" y="90" width="30" height="20"/>
        <!-- Cuerpo -->
        <rect class="figura" x="70" y="130" width="110" height="100"/>
        <!-- Patas -->
        <rect class="figura" x="75" y="230" width="35" height="60"/>
        <rect class="figura" x="140" y="230" width="35" height="60"/>
    </svg>

</body>
</html>
